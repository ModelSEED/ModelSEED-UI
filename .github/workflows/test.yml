name: Test Suite

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

env:
  NEXT_PUBLIC_USE_MODELSEED_API: 'true'
  NEXT_PUBLIC_MODELSEED_API_URL: 'http://poplar.cels.anl.gov:8000'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
      - name: Check coverage thresholds
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(cat coverage/coverage-summary.json | grep -o '"lines":"[0-9.]*"' | cut -d'"' -f4)
            echo "Line coverage: $LINES%"
          fi

  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PATRIC_TOKEN: ${{ secrets.PATRIC_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
