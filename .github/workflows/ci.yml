name: CI - Quality Assurance & Testing

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

# Environment variables available to all jobs (no secrets here)
env:
  NEXT_PUBLIC_USE_MODELSEED_API: 'true'
  # Note: API_URL should be set in .env.local for local dev
  # CI will skip API-dependent tests if API is unavailable

jobs:
  # ===========================================
  # CODE QUALITY CHECKS (No Secrets Required)
  # ===========================================
  
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true
      
      - name: Upload lint results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: |
            eslint-report/
          retention-days: 7

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # ===========================================
  # SECURITY AUDITS
  # ===========================================
  
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for sensitive files in commit
        run: |
          # Check for common sensitive files that shouldn't be committed
          if git diff --name-only HEAD~1 HEAD | grep -E "(\.env$|\.env\.local$|credentials\.json|secrets\.json|\.pem$|\.key$)"; then
            echo "⚠️  Warning: Potentially sensitive files detected in commit"
            echo "Files changed:"
            git diff --name-only HEAD~1 HEAD | grep -E "(\.env$|\.env\.local$|credentials\.json|secrets\.json|\.pem$|\.key$)"
          fi

  # ===========================================
  # BUILD VERIFICATION
  # ===========================================
  
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1

  # ===========================================
  # UNIT TESTS
  # ===========================================
  
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm run test:run
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  # ===========================================
  # E2E TESTS (Requires Secrets - Only on Push)
  # ===========================================
  
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Only run on push to protected branches where secrets are available
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    needs: [build, lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Only set if secrets are configured in repository
          PATRIC_TOKEN: ${{ secrets.PATRIC_TOKEN }}
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ===========================================
  # DEPLOYMENT PREVIEW (Optional)
  # ===========================================
  
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      
      - name: Deploy Preview Comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Build Preview'));
            
            const body = `## ✅ Build Successful
            
            A preview build completed successfully. 
            
            **Note:** Full E2E tests run on push to main/develop branches.`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  # ===========================================
  # SUMMARY
  # ===========================================
  
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security-audit, build, unit-tests]
    if: always()
    steps:
      - name: Create Summary
        run: |
          echo "## CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check each job status
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Lint
          if [ "${{ needs.lint.result }}" == "success" ]; then
            echo "| ✅ ESLint | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ ESLint | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # TypeScript
          if [ "${{ needs.typecheck.result }}" == "success" ]; then
            echo "| ✅ TypeScript | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ TypeScript | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security
          if [ "${{ needs.security-audit.result }}" == "success" ]; then
            echo "| ✅ Security Audit | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ⚠️  Security Audit | Warning |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Build
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "| ✅ Build | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ Build | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Unit Tests
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "| ✅ Unit Tests | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ Unit Tests | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Full E2E tests:** Only run on push to \`develop\` or \`master\` branches with configured secrets." >> $GITHUB_STEP_SUMMARY
