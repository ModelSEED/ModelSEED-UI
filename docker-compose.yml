services:
  modelseed-ui-staging:
    build:
      context: .
      args:
        <<: *app_build_args
        NEXT_PUBLIC_DEPLOYMENT_MODE: staging
    container_name: modelseed_ui_staging
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      <<: *app_runtime_env
      NEXT_PUBLIC_DEPLOYMENT_MODE: staging
    profiles:
      - staging

  modelseed-ui-production:
    build:
      context: .
      args:
        <<: *app_build_args
        NEXT_PUBLIC_DEPLOYMENT_MODE: production
    container_name: modelseed_ui_production
    ports:
      - "3001:3000"
    restart: unless-stopped
    environment:
      <<: *app_runtime_env
      NEXT_PUBLIC_DEPLOYMENT_MODE: production
    profiles:
      - production
