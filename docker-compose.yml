services:
  modelseed-ui:
    build:
      context: .
      args:
        - NEXT_PUBLIC_GIT_VERSION=${NEXT_PUBLIC_GIT_VERSION}
        - NEXT_PUBLIC_GIT_COMMIT=${NEXT_PUBLIC_GIT_COMMIT}
        - NEXT_PUBLIC_GIT_BRANCH=${NEXT_PUBLIC_GIT_BRANCH}
        - NEXT_PUBLIC_DEPLOY_DATE=${NEXT_PUBLIC_DEPLOY_DATE}
        - NEXT_PUBLIC_DEPLOYMENT_MODE=${NEXT_PUBLIC_DEPLOYMENT_MODE:-staging}
        - NEXT_PUBLIC_SITE_BASE_URL=${NEXT_PUBLIC_SITE_BASE_URL:-}
        - NEXT_PUBLIC_SITE_BASE_URL_STAGING=${NEXT_PUBLIC_SITE_BASE_URL_STAGING:-}
        - NEXT_PUBLIC_SITE_BASE_URL_PRODUCTION=${NEXT_PUBLIC_SITE_BASE_URL_PRODUCTION:-}
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
        - NEXT_PUBLIC_API_BASE_URL_STAGING=${NEXT_PUBLIC_API_BASE_URL_STAGING:-}
        - NEXT_PUBLIC_API_BASE_URL_PRODUCTION=${NEXT_PUBLIC_API_BASE_URL_PRODUCTION:-}
        - NEXT_PUBLIC_REST_BASE_URL=${NEXT_PUBLIC_REST_BASE_URL:-}
        - NEXT_PUBLIC_REST_BASE_URL_STAGING=${NEXT_PUBLIC_REST_BASE_URL_STAGING:-}
        - NEXT_PUBLIC_REST_BASE_URL_PRODUCTION=${NEXT_PUBLIC_REST_BASE_URL_PRODUCTION:-}
        - NEXT_PUBLIC_SOLR_BASE_URL=${NEXT_PUBLIC_SOLR_BASE_URL:-}
        - NEXT_PUBLIC_SOLR_BASE_URL_STAGING=${NEXT_PUBLIC_SOLR_BASE_URL_STAGING:-}
        - NEXT_PUBLIC_SOLR_BASE_URL_PRODUCTION=${NEXT_PUBLIC_SOLR_BASE_URL_PRODUCTION:-}
        - NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION=${NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION:-}
        - NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION_STAGING=${NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION_STAGING:-}
        - NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION_PRODUCTION=${NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION_PRODUCTION:-}
        - NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION=${NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION:-}
        - NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION_STAGING=${NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION_STAGING:-}
        - NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION_PRODUCTION=${NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION_PRODUCTION:-}
        - NEXT_PUBLIC_STATUS_API_URL=${NEXT_PUBLIC_STATUS_API_URL:-}
        - NEXT_PUBLIC_STATUS_API_URL_STAGING=${NEXT_PUBLIC_STATUS_API_URL_STAGING:-}
        - NEXT_PUBLIC_STATUS_API_URL_PRODUCTION=${NEXT_PUBLIC_STATUS_API_URL_PRODUCTION:-}
        - NEXT_PUBLIC_USE_MODELSEED_API=true
        - NEXT_PUBLIC_USE_NEW_PROXY=true
    container_name: modelseed_ui
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_DEPLOYMENT_MODE=${NEXT_PUBLIC_DEPLOYMENT_MODE:-staging}
      - NEXT_PUBLIC_SITE_BASE_URL=${NEXT_PUBLIC_SITE_BASE_URL:-}
      - NEXT_PUBLIC_SITE_BASE_URL_STAGING=${NEXT_PUBLIC_SITE_BASE_URL_STAGING:-}
      - NEXT_PUBLIC_SITE_BASE_URL_PRODUCTION=${NEXT_PUBLIC_SITE_BASE_URL_PRODUCTION:-}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
      - NEXT_PUBLIC_API_BASE_URL_STAGING=${NEXT_PUBLIC_API_BASE_URL_STAGING:-}
      - NEXT_PUBLIC_API_BASE_URL_PRODUCTION=${NEXT_PUBLIC_API_BASE_URL_PRODUCTION:-}
      - NEXT_PUBLIC_REST_BASE_URL=${NEXT_PUBLIC_REST_BASE_URL:-}
      - NEXT_PUBLIC_REST_BASE_URL_STAGING=${NEXT_PUBLIC_REST_BASE_URL_STAGING:-}
      - NEXT_PUBLIC_REST_BASE_URL_PRODUCTION=${NEXT_PUBLIC_REST_BASE_URL_PRODUCTION:-}
      - NEXT_PUBLIC_SOLR_BASE_URL=${NEXT_PUBLIC_SOLR_BASE_URL:-}
      - NEXT_PUBLIC_SOLR_BASE_URL_STAGING=${NEXT_PUBLIC_SOLR_BASE_URL_STAGING:-}
      - NEXT_PUBLIC_SOLR_BASE_URL_PRODUCTION=${NEXT_PUBLIC_SOLR_BASE_URL_PRODUCTION:-}
      - NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION=${NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION:-}
      - NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION_STAGING=${NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION_STAGING:-}
      - NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION_PRODUCTION=${NEXT_PUBLIC_SOLR_REACTIONS_COLLECTION_PRODUCTION:-}
      - NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION=${NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION:-}
      - NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION_STAGING=${NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION_STAGING:-}
      - NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION_PRODUCTION=${NEXT_PUBLIC_SOLR_COMPOUNDS_COLLECTION_PRODUCTION:-}
      - NEXT_PUBLIC_STATUS_API_URL=${NEXT_PUBLIC_STATUS_API_URL:-}
      - NEXT_PUBLIC_STATUS_API_URL_STAGING=${NEXT_PUBLIC_STATUS_API_URL_STAGING:-}
      - NEXT_PUBLIC_STATUS_API_URL_PRODUCTION=${NEXT_PUBLIC_STATUS_API_URL_PRODUCTION:-}
      - NEXT_PUBLIC_USE_MODELSEED_API=true
      - NEXT_PUBLIC_USE_NEW_PROXY=true
